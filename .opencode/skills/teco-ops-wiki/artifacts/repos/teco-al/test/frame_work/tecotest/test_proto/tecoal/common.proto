syntax = "proto2";

package testpt;

message HandleParam {
    optional int32 slave_group_num    =1 [default = 0];
    optional int32 slave_core_num     =2 [default = 32];
    optional int32 slave_ldm_size     =3 [default = 225280];//220K
}

enum MathType{
    DEFAULT_MATH = 0;
    TENSOR_ACC_MATH = 1;
    TENSOR_ACC_MATH_ALLOW_CONVERSION = 2;
}

enum NanPropagation{
    NOT_PROPAGATE_NAN = 0;
    PROPAGATE_NAN = 1;
}

//-----------------LOSS----------------------
enum LossReductionMode{
    LOSS_REDUCTION_NONE = 0;
    LOSS_REDUCTION_MEAN = 1;  // default
    LOSS_REDUCTION_SUM = 2;
    LOSS_REDUCTION_BATCH_MEAN = 3;
}

enum GluAccurateMode{
    GLU_NORMAL_PRECISION = 0;
    GLU_HIGH_PRECISION = 1;
}

enum ModelMode{
    MODEL_TRAINING = 0;  // Default training mode
    MODEL_INFER = 1;
}

