# Codex MCP 配置示例（复制到 ~/.codex/config.toml）
#
# 用途：在线文档检索（docs-center）与知识图谱（knowledge-graph）
# 前置：需内网/VPN 可访问 docs.tecorigin.net / ai.tecorigin.net
#
# 使用方式：
#   cat configs/codex_mcp.example.toml >> ~/.codex/config.toml
#   或手动合并 [mcp_servers.*] 段落到现有 config.toml

[mcp_servers.docs-center]
transport = "streamable_http"
url = "http://docs.tecorigin.net/mcp"

[mcp_servers.knowledge-graph]
transport = "streamable_http"
url = "http://ai.tecorigin.net/mcp"
